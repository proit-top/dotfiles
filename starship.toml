[hostname]
disabled = false
ssh_only = false  # Поставьте true, если хотите видеть только при SSH-подключении
format = "[$hostname](bold yellow) "
trim_at = "-"


[time]
disabled = false
format = '[$time](bold cyan) '
time_format = "%H:%M:%S"

[character]
success_symbol = "[❯](bold green)"
